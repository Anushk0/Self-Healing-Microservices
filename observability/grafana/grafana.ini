# Anonymous viewer access and embedding, so the dashboard can be opened from the console without
# a login prompt. This is a local development stack on localhost only - never a production posture.
[security]
allow_embedding = true
[auth.anonymous]
enabled = true
org_role = Viewer
[auth]
disable_login_form = false
[users]
default_theme = dark
[analytics]
reporting_enabled = false
check_for_updates = false
