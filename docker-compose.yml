services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aiops-dev-password}
      POSTGRES_DB: ledger_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host port 5433, not 5432: the native Homebrew Postgres from Week 2 (still used by
      # ledger-service's local `mvn test` run) already owns 5432 on the host. Containers
      # reach this one via the internal `postgres:5432` address regardless.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-key-change-me-1234567890}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ledger-service:
    build: ./ledger-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledger_db
      DB_USERNAME: aiops
      DB_PASSWORD: ${DB_PASSWORD:-aiops-dev-password}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-service:
    build: ./notification-service
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  payment-service:
    build: ./payment-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      LEDGER_SERVICE_URL: http://ledger-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports:
      - "8082:8082"
    depends_on:
      auth-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Observability stack. Optional: the four services and the AI pipeline run without it, and the
  # pipeline reads metrics straight from each service's /actuator/prometheus rather than through
  # Prometheus. This exists so an operator can watch a fault appear and clear in real time.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: aiops-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      auth-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aiops-grafana
    environment:
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # Steady synthetic traffic through the payment chain. Without it the estate is idle, and the
  # two request-path faults (auth-key-error, notification-latency) produce no metrics at all -
  # Micrometer does not create a timer series until the code path runs - so injecting them
  # appears to do nothing. Mirrors telemetry/payment_probe.py's cached-token behaviour.
  load-generator:
    image: python:3.12-alpine
    container_name: aiops-load-generator
    command: ["python", "/app/load_generator.py"]
    volumes:
      - ./observability/load_generator.py:/app/load_generator.py:ro
    environment:
      LOAD_INTERVAL_SECONDS: "2"
      LOAD_AMOUNT: "1.00"
    depends_on:
      auth-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
